# /etc/nginx/sites-available/shop  (then: sudo ln -s ../sites-available/shop /etc/nginx/sites-enabled/)
# nginx listens on port 80 for everyone and passes each visitor to the app on 127.0.0.1:8000.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
